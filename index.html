<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lex Causae - Die 7 Sphären</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

        :root {
            --bg-color: #07090f;
            --gold: #d4af37;
            --gold-dim: #8c6a28;
            --text-main: #e2dcd3;
            --text-dim: #9da7b3;
            --modal-bg: #11141c;
            --accent-glow: rgba(212, 175, 55, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'EB Garamond', serif;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 40%, #141829 0%, #07090f 100%);
            min-height: 100vh;
        }

        h1, h2, h3, .tab-btn, .lang-btn, .action-btn {
            font-family: 'Cinzel', serif;
        }

        /* Sprachwechsler */
        .top-nav {
            position: absolute;
            top: 20px;
            right: 25px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .lang-btn {
            background: rgba(17, 20, 28, 0.8);
            border: 1px solid var(--gold-dim);
            color: var(--gold-dim);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .lang-btn.active, .lang-btn:hover {
            background: var(--gold);
            color: #07090f;
            font-weight: 700;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Header */
        header {
            text-align: center;
            padding: 70px 20px 20px;
        }

        header h1 {
            font-size: clamp(2.4rem, 6vw, 3.8rem);
            color: var(--gold);
            letter-spacing: 8px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
        }

        header p {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: var(--text-dim);
            letter-spacing: 2px;
            font-style: italic;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Planeten-System */
        .system-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 45px;
            max-width: 1100px;
            margin: 40px auto 70px;
            padding: 20px;
        }

        .sphere {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.4s ease;
            width: 130px;
        }

        .sphere:hover {
            transform: translateY(-8px) scale(1.08);
            filter: drop-shadow(0 0 25px var(--accent-glow));
        }

        .planet {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin-bottom: 14px;
            box-shadow: inset -18px -18px 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 255, 255, 0.08);
            position: relative;
        }

        /* Planeten-Farben */
        .p1 { background: radial-gradient(circle at 35% 35%, #5580bd, #172436); }
        .p2 { background: radial-gradient(circle at 35% 35%, #5ea484, #132b1f); }
        .p3 { background: radial-gradient(circle at 35% 35%, #c87a4a, #4a1e0b); }
        .p4 { background: radial-gradient(circle at 35% 35%, #b14850, #360c10); }
        .p5 { background: radial-gradient(circle at 35% 35%, #d8b87e, #49391d); }
        .p6 { background: radial-gradient(circle at 35% 35%, #8e4c82, #290e24); }
        .p7 { background: radial-gradient(circle at 35% 35%, #e0ce60, #4a410b); }

        .sphere-title {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            color: var(--text-main);
            letter-spacing: 1.5px;
            text-align: center;
            line-height: 1.3;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 12, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            backdrop-filter: blur(8px);
            z-index: 1000;
            padding: 15px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--modal-bg);
            border: 1px solid var(--gold-dim);
            max-width: 720px;
            width: 100%;
            border-radius: 6px;
            padding: 40px 30px;
            position: relative;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), inset 0 0 25px rgba(212, 175, 55, 0.08);
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            color: var(--gold-dim);
            cursor: pointer;
            transition: color 0.3s;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--gold);
        }

        #modal-title {
            color: var(--gold);
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            margin: 0 0 25px 0;
            letter-spacing: 3px;
            border-bottom: 1px solid rgba(140, 106, 40, 0.35);
            padding-bottom: 15px;
        }

        /* 4-Ebenen Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--gold-dim);
            color: var(--text-dim);
            padding: 8px 14px;
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--gold-dim);
            color: #07090f;
            font-weight: 700;
        }

        .tab-content {
            display: none;
            font-size: clamp(1.1rem, 2.8vw, 1.35rem);
            line-height: 1.7;
            padding: 10px 15px;
            color: var(--text-main);
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        .bowl-indicator {
            font-size: 0.85rem;
            color: var(--gold-dim);
            margin-top: 25px;
            font-style: italic;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="lang-btn active" onclick="setLanguage('de')" id="btn-de">DE</button>
        <button class="lang-btn" onclick="setLanguage('es')" id="btn-es">ES</button>
    </div>

    <header>
        <h1 id="main-title">Lex Causae</h1>
        <p id="main-subtitle">Wähle eine Sphäre, um die kosmische Ordnung freizulegen.</p>
    </header>

    <div class="system-container" id="spheres-container">
        <!-- Rendered via JS -->
    </div>

    <!-- Modal für 4 Ebenen -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Sphäre</h2>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(1)" id="tab-btn-1">1. Axiom</button>
                <button class="tab-btn" onclick="switchTab(2)" id="tab-btn-2">2. Biologie</button>
                <button class="tab-btn" onclick="switchTab(3)" id="tab-btn-3">3. Kodex</button>
                <button class="tab-btn" onclick="switchTab(4)" id="tab-btn-4">4. Praxis</button>
            </div>

            <div id="tab-1" class="tab-content active"></div>
            <div id="tab-2" class="tab-content"></div>
            <div id="tab-3" class="tab-content"></div>
            <div id="tab-4" class="tab-content"></div>
            
            <div class="bowl-indicator" id="bowl-text">Klangschale resoniert...</div>
        </div>
    </div>

    <script>
        // --- Web Audio API: Klangschalen-Synthesizer ---
        const bowlFreqs = [246.94, 440.00, 392.00, 349.23, 329.63, 293.66, 261.63]; 
        let audioCtx;

        function playSingingBowl(index) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                const freq = bowlFreqs[index];
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.value = freq;
                
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.value = freq + 1.5; // Schwebung für Klangschalen-Charakter

                osc1.connect(gain1);
                osc2.connect(gain2);
                gain1.connect(audioCtx.destination);
                gain2.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                gain1.gain.setValueAtTime(0, now);
                gain1.gain.linearRampToValueAtTime(0.35, now + 1.2);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 8);
                
                gain2.gain.setValueAtTime(0, now);
                gain2.gain.linearRampToValueAtTime(0.25, now + 1.2);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 8);
                
                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 8.1);
                osc2.stop(now + 8.1);
            } catch (e) {
                console.warn("Audio Context Init:", e);
            }
        }

        // --- Datenbank & Übersetzungen ---
        let currentLang = 'de';
        let currentSphereIndex = 0;

        const uiText = {

                bowl: "Klangschale resoniert..."
            },
            es: {

        const spheresData = [

                },

                    title: "I. Mentalismo",
                    t1: "La información y la observación preceden a la materia; la realidad está estructurada por leyes universales.",
                    t2: "El SARA y el córtex prefrontal filtran el mundo; aquello en lo que te enfocas se convierte en tu realidad percibida.",
                    t3: "Domino mi mente y no me dejo guiar por estímulos inferiores ni distracciones.",
                    t4: "Silencio mental deliberado, bloques de enfoque y reducción radical del ruido digital para detener la dispersión del pensamiento."
                }
            },
            {
                de: {
                    title: "II. Wahrheit & Klarheit",
                    t1: "Das Gesetz der Nicht-Widersprüchlichkeit; ein System kollabiert, wenn interne Daten fehlerhaft sind.",
                    t2: "Lügen und Selbstbetrug erzeugen chronische Amygdala-Aktivierung, Cortisolausschüttung und kognitive Dissonanz.",
                    t3: "Ich spreche und lebe die radikale Wahrheit; sie befreit von Furcht und macht unerschütterlich.",
                    t4: "Gnadenlose Bestandsaufnahme (Reality Check): Finanzen, Gesundheit und Beziehungen ohne Schönfärberei protokollieren."
                },
                es: {
                    title: "II. Verdad y Claridad",
                    t1: "La ley de la no contradicción; un sistema colapsa si sus datos internos son defectuosos.",
                    t2: "Las mentiras y el autoengaño generan activación crónica de la amígdala, liberación de cortisol y disonancia cognitiva.",
                    t3: "Hablo y vivo la verdad radical; me libera del miedo y me hace inquebrantable.",
                    t4: "Inventario implacable (Reality Check): Registrar finanzas, salud y relaciones sin autoengaños."
                }
            },
            {
                de: {
                    title: "III. Schwingung & Tat",
                    t1: "Stillstand existiert im Universum nicht; alles ist kinetische Energie und Bewegung.",
                    t2: "Dopaminbelohnung folgt auf Bewegung und Problemlösung; Trägheit führt zu Neuroplastizität des Verfalls.",
                    t3: "Ich wandle Gedanken sofort in Handlung um; wer zögert, wird gelebt – wer handelt, führt.",
                    t4: "Das 5-Sekunden-Gesetz: Vom Impuls zur Tat ohne Zögern, um die Trägheitsbarriere der Entropie sofort zu zerschlagen."
                },
                es: {
                    title: "III. Vibración y Acción",
                    t1: "El estancamiento no existe en el universo; todo es energía cinética y movimiento.",
                    t2: "La recompensa de dopamina sigue al movimiento y la resolución de problemas; la inercia lleva a la neuroplasticidad del declive.",
                    t3: "Transformo los pensamientos en acción inmediatamente; quien duda, es arrastrado; quien actúa, lidera.",
                    t4: "La regla de los 5 segundos: Del impulso al acto sin dudar, para destruir la barrera de inercia de la entropía."
                }
            },
            {
                de: {
                    title: "IV. Polarität",
                    t1: "Gegensätze sind zwei Pole desselben Phänomens (Kälte ist die Abwesenheit von Wärme).",
                    t2: "Homöostase und Schmerz-Freude-Gleichgewicht; wer Schmerz meidet, verliert die Fähigkeit zu tiefer Erfüllung.",
                    t3: "Widerstand ist kein Unglück, sondern das Material, an dem mein Wille wächst.",
                    t4: "Willkürliche Härte (Amor Fati): Kälteexposition, schweres Training und gezielter Komfortverzicht, um emotionale Schwingungen zu zentrieren."
                },
                es: {
                    title: "IV. Polaridad",
                    t1: "Los opuestos son dos polos del mismo fenómeno (el frío es la ausencia de calor).",
                    t2: "Homeostasis y equilibrio dolor-placer; quien evita el dolor pierde la capacidad de experimentar una realización profunda.",
                    t3: "La resistencia no es una desgracia, sino el material en el que crece y se forja mi voluntad.",
                    t4: "Dureza voluntaria (Amor Fati): Exposición al frío, entrenamiento duro y renuncia al confort para centrar las vibraciones."
                }
            },
            {
                de: {
                    title: "V. Rhythmus & Balance",
                    t1: "Periodische Schwingungen, Wellenbewegungen und Kreisbahnen bestimmen alle Naturzyklen.",
                    t2: "Zirkadiane Rhythmen, Hormonzyklen (Cortisol/Melatonin), Ultradiane Leistungsphasen.",
                    t3: "Jeder Tag beginnt mit bewusster Ordnung; wo Rhythmus und Disziplin herrschen, weicht das Chaos.",
                    t4: "Feste Schlaf-, Fasten- und Arbeitsfenster; Wiederherstellung natürlicher Taktung gegen die Verwahrlosung des Alltags."
                },
                es: {
                    title: "V. Ritmo y Equilibrio",
                    t1: "Las vibraciones periódicas, los movimientos ondulatorios y las órbitas determinan los ciclos naturales.",
                    t2: "Ritmos circadianos, ciclos hormonales (cortisol/melatonina), fases de rendimiento ultradianas.",
                    t3: "Cada día comienza con orden consciente; donde reina el ritmo y la disciplina, el caos retrocede.",
                    t4: "Ventanas estrictas de sueño, ayuno y trabajo; restauración del ritmo natural contra la negligencia."
                }
            },
            {
                de: {
                    title: "VI. Kausalität",
                    t1: "Jede Wirkung besitzt eine zwingende Ursache; das Kausalitätsprinzip duldet keine Zufälle.",
                    t2: "Interner Kontrollort (Internal Locus of Control); Opfermentalität lähmt das Nervensystem, Eigenverantwortung mobilisiert Energie.",
                    t3: "Ich bin niemals das Opfer der Umstände, sondern stets die bewusste Ursache meines Schicksals.",
                    t4: "Ursachen-Rückverfolgung: Bei jedem Fehler sofort fragen: 'Welche Ursache habe ich gesetzt?' – und den Hebel ansetzen."
                },
                es: {
                    title: "VI. Causalidad",
                    t1: "Toda causa tiene su efecto; el principio de causalidad no tolera el azar.",
                    t2: "Locus de control interno; la mentalidad de víctima paraliza el sistema nervioso, la responsabilidad moviliza energía.",
                    t3: "Nunca soy víctima de las circunstancias, sino siempre la causa consciente de mi destino.",
                    t4: "Rastreo de causas: Ante cada error, preguntar '¿Qué causa he plantado?' y ajustar la propia conducta."
                }
            },
            {
                de: {
                    title: "VII. Generierung & Vertrauen",
                    t1: "Schöpfung erfordert die Verschmelzung zweier Pole (Struktur und Dynamik, Ordnung und Chaos).",
                    t2: "Das parasympathische System (Regeneration) nährt den Willen; Schöpfungskraft entsteht erst, wenn chronische Überlebensangst weicht.",
                    t3: "Ich schütze meine Kraft, wirke integer und großzügig und lasse mein Werk für sich sprechen.",
                    t4: "Aufbau langlebiger Systeme: Vermögensaufbau, bleibende Dokumente, Weitergabe von Wissen – Ordnung schaffen für die Ewigkeit."
                },
                es: {
                    title: "VII. Generación y Confianza",
                    t1: "La creación requiere la fusión de dos polos (estructura y dinámica, orden y caos).",
                    t2: "El sistema parasimpático nutre la voluntad; la fuerza creativa surge cuando el miedo a la supervivencia desaparece.",
                    t3: "Protejo mi fuerza, actúo con integridad y generosidad, y dejo que mi obra hable por sí misma.",
                    t4: "Construcción de sistemas duraderos: Creación de patrimonio, documentos legados, transmisión de conocimientos para la posteridad."
                }
            }
        ];

        // --- DOM-Interaktion ---
        function renderSpheres() {
            const container = document.getElementById("spheres-container");
            container.innerHTML = "";
            spheresData.forEach((sphere, i) => {
                const div = document.createElement("div");
                div.className = "sphere";
                div.onclick = () => openModal(i);
                div.innerHTML = `
                    <div class="planet p${i+1}"></div>
                    <div class="sphere-title">${sphere[currentLang].title}</div>
                `;
                container.appendChild(div);
            });
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById("btn-de").classList.toggle("active", lang === 'de');
            document.getElementById("btn-es").classList.toggle("active", lang === 'es');
            
            document.getElementById("main-title").innerText = uiText[lang].title;
            document.getElementById("main-subtitle").innerText = uiText[lang].subtitle;
            document.getElementById("bowl-text").innerText = uiText[lang].bowl;
            
            for(let i=1; i<=4; i++) {
                document.getElementById(`tab-btn-${i}`).innerText = uiText[lang].tabs[i-1];
            }
            
            renderSpheres();
            
            if (document.getElementById("modal").classList.contains("active")) {
                populateModal(currentSphereIndex);
            }
        }

        function populateModal(index) {
            const data = spheresData[index][currentLang];
            document.getElementById("modal-title").innerText = data.title;
            document.getElementById("tab-1").innerText = data.t1;
            document.getElementById("tab-2").innerText = data.t2;
            document.getElementById("tab-3").innerText = data.t3;
            document.getElementById("tab-4").innerText = data.t4;
        }

        function openModal(index) {
            currentSphereIndex = index;
            populateModal(index);
            switchTab(1);
            document.getElementById("modal").classList.add("active");
            playSingingBowl(index);
        }

        function closeModal() {
            document.getElementById("modal").classList.remove("active");
        }

        function switchTab(tabNum) {
            for(let i=1; i<=4; i++) {
                document.getElementById("tab-"+i).classList.remove("active");
                document.getElementById(`tab-btn-${i}`).classList.remove("active");
            }
            document.getElementById("tab-"+tabNum).classList.add("active");
            document.getElementById(`tab-btn-${tabNum}`).classList.add("active");
        }

        window.onclick = function(event) {
            const modal = document.getElementById("modal");
            if (event.target === modal) {
                closeModal();
            }
        };

        // Start initialisieren
        setLanguage('de');
    </script>
</body>
</html>
