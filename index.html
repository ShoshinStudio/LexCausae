<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lex Causae - Die 7 Sphären</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital@0;1&display=swap');

        :root {
            --bg-color: #04060d;
            --gold: #d4af37;
            --gold-dim: #8c6a28;
            --text-main: #e2dcd3;
            --text-dim: #9da7b3;
            --modal-bg: rgba(17, 20, 28, 0.95);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'EB Garamond', serif;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, #161a2b 0%, #04060d 100%);
            min-height: 100vh;
        }

        /* --- NEU: Deep Space Hintergrund --- */
        canvas#sky {
            position: fixed; inset: 0; width: 100%; height: 100%; z-index: -3; pointer-events: none;
        }
        .nebula-layer {
            position: fixed; inset: -20%; z-index: -2; pointer-events: none; mix-blend-mode: screen; filter: blur(36px);
        }
        .nebula-1 {
            background: 
                radial-gradient(ellipse 45% 35% at 20% 25%, rgba(138, 43, 226, 0.15), transparent 70%),
                radial-gradient(ellipse 40% 30% at 80% 30%, rgba(255, 64, 129, 0.12), transparent 70%);
            animation: driftNebula 90s ease-in-out infinite alternate;
        }
        @keyframes driftNebula {
            0% { transform: translate(-3%, -2%) scale(1) rotate(0deg); }
            100% { transform: translate(3%, 2%) scale(1.15) rotate(5deg); }
        }

        h1, h2, h3, .tab-btn, .lang-btn, .sphere-title {
            font-family: 'Cinzel', serif;
        }

        /* Sprachwechsler */
        .lang-switch {
            position: absolute;
            top: 20px; right: 20px;
            display: flex; gap: 10px;
            z-index: 10;
        }
        .lang-btn {
            background: rgba(4, 6, 13, 0.6);
            border: 1px solid var(--gold-dim);
            color: var(--gold-dim);
            padding: 5px 10px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }
        .lang-btn.active, .lang-btn:hover {
            background: var(--gold-dim);
            color: #000;
        }

        /* Header */
        header {
            text-align: center;
            padding: 60px 20px 20px;
            position: relative;
            z-index: 1;
        }
        header h1 {
            font-size: 3rem;
            color: var(--gold);
            letter-spacing: 8px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }
        header p {
            font-size: 1.2rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            font-style: italic;
        }

        /* Sphären-Grid */
        .system-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .sphere {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.4s ease, filter 0.4s ease;
        }
        .sphere:hover {
            transform: translateY(-10px) scale(1.05);
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.4));
        }

        /* --- UPDATE: NASA Planeten-Look --- */
        .planet {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            position: relative;
            /* Atmosphärische Schattierung für den 3D-Kugel-Effekt */
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.9), 0 0 20px rgba(255,255,255,0.05);
        }
        .planet::after {
            content: ""; position: absolute; inset: 0; border-radius: 50%;
            box-shadow: inset 4px 4px 10px rgba(255,255,255,0.4); pointer-events: none;
        }

        .p1 { background: radial-gradient(circle at 35% 35%, #7aa8ff 0%, #4a6fa5 45%, #1e2a3b 85%, #090e24 100%); }
        .p2 { background: radial-gradient(circle at 35% 35%, #affce0 0%, #528c73 45%, #182e23 85%, #051f16 100%); }
        .p3 { background: radial-gradient(circle at 35% 35%, #e67e22 0%, #b56c42 45%, #4a2110 85%, #1a0b05 100%); }
        .p4 { background: radial-gradient(circle at 35% 35%, #ff9e94 0%, #9e3d43 45%, #381013 85%, #140507 100%); }
        
        /* Planet 5 mit Ring-System */
        .p5 { background: radial-gradient(circle at 35% 35%, #e1d0ff 0%, #c4a773 45%, #4f4027 85%, #1c150c 100%); }
        .p5::before {
            content: ""; position: absolute; left: 50%; top: 50%; width: 180%; height: 40%;
            transform: translate(-50%, -50%) rotate(-20deg); border-radius: 50%;
            border: 3px solid rgba(196, 167, 115, 0.4);
            box-shadow: 0 0 10px rgba(196, 167, 115, 0.2); pointer-events: none;
        }

        .p6 { background: radial-gradient(circle at 35% 35%, #ffb6c1 0%, #7a426f 45%, #2b1326 85%, #120710 100%); }
        .p7 { background: radial-gradient(circle at 35% 35%, #fff6cc 0%, #d1c058 45%, #4d4411 85%, #1f1b07 100%); }

        .sphere-title {
            font-size: 1.1rem;
            color: var(--text-main);
            letter-spacing: 2px;
            text-align: center;
        }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex;
            justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
            backdrop-filter: blur(8px); z-index: 1000;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--modal-bg); border: 2px solid var(--gold-dim);
            max-width: 700px; width: 90%; border-radius: 4px; padding: 40px; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(212, 175, 55, 0.1);
            text-align: center;
        }

        .close-btn {
            position: absolute; top: 15px; right: 20px; font-size: 2rem;
            color: var(--gold-dim); cursor: pointer; transition: color 0.3s;
        }
        .close-btn:hover { color: var(--gold); }

        #modal-title {
            color: var(--gold); font-size: 2.2rem; margin-top: 0;
            letter-spacing: 4px; border-bottom: 1px solid var(--gold-dim); padding-bottom: 20px;
        }

        .tabs {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent; border: 1px solid var(--gold-dim);
            color: var(--text-dim); padding: 8px 15px; cursor: pointer;
            font-size: 1rem; letter-spacing: 1px; transition: all 0.3s;
        }
        .tab-btn.active, .tab-btn:hover { background: var(--gold-dim); color: #000; font-weight: bold; }

        .tab-content { display: none; font-size: 1.3rem; line-height: 1.6; animation: fadeIn 0.5s; }
        .tab-content.active { display: block; }
        
        .bowl-indicator {
            font-size: 0.9rem; color: var(--gold-dim); margin-top: 20px;
            font-style: italic; opacity: 0.6;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

        // --- UPDATE: KRISTALL-KLANGSCHALEN (Web Audio API) ---
        // Die reinen 432-Hz basierten Frequenzen
        const bowlFreqs = [432, 486, 540, 576, 648, 720, 864]; 
        let audioCtx, masterGain;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
            
            // Hochpassfilter: Verhindert tiefes Wummern, lässt nur helles Kristallsingen durch
            const highpass = audioCtx.createBiquadFilter();
            highpass.type = 'highpass';
            highpass.frequency.setValueAtTime(220, audioCtx.currentTime);
            
            masterGain.connect(highpass);
            highpass.connect(audioCtx.destination);
        }

        function playSingingBowl(index) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const freq = bowlFreqs[index];
            const now = audioCtx.currentTime;
            masterGain.gain.setTargetAtTime(1.0, now, 0.5);
            
            // Obertöne für die gläserne Schwebung (Beating-Effekt)
            const partials = [
                { mult: 1.0, gain: 1.0, detune: -0.6 },
                { mult: 1.0, gain: 0.9, detune: 0.8 },
                { mult: 2.76, gain: 0.22, detune: 0 }
            ];

            partials.forEach(p => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq * p.mult, now);
                osc.detune.setValueAtTime(p.detune, now);
                
                // Sanfter, langer Anschlag und langsames Verhallen
                g.gain.setValueAtTime(0.0001, now);
                g.gain.linearRampToValueAtTime(0.25 * p.gain, now + 0.8);
                g.gain.exponentialRampToValueAtTime(0.0001, now + 8.0);
                
                osc.connect(g);
                g.connect(masterGain);
                
                osc.start(now);
                osc.stop(now + 8.5);
            });
        }

                },
                es: {

                    t1: "La creación requiere la fusión de dos polos (estructura y dinámica, orden y caos).",
                    t2: "El sistema parasimpático nutre la voluntad; la fuerza creativa surge cuando el miedo a la supervivencia desaparece.",
                    t3: "Protejo mi fuerza, actúo con integridad y generosidad, y dejo que mi obra hable por sí misma.",

        // --- RENDER & LOGIK ---
        function renderSpheres() {
            const container = document.getElementById("spheres-container");
            container.innerHTML = "";
            spheresData.forEach((sphere, i) => {
                const div = document.createElement("div");
                div.className = "sphere";
                div.onclick = () => openModal(i);
                div.innerHTML = `
                    <div class="planet p${i+1}"></div>
                    <div class="sphere-title">${sphere[currentLang].title}</div>
                `;
                container.appendChild(div);
            });
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById("btn-de").classList.toggle("active", lang === 'de');
            document.getElementById("btn-es").classList.toggle("active", lang === 'es');
            
            document.getElementById("main-title").innerText = uiText[lang].title;
            document.getElementById("main-subtitle").innerText = uiText[lang].subtitle;
            document.getElementById("bowl-text").innerText = uiText[lang].bowl;
            
            for(let i=1; i<=4; i++) {
                document.getElementById(`tab-btn-${i}`).innerText = uiText[lang].tabs[i-1];
            }
            renderSpheres();
            if (document.getElementById("modal").classList.contains("active")) {
                populateModal(currentSphereIndex);
            }
        }

        function populateModal(index) {
            const data = spheresData[index][currentLang];
            document.getElementById("modal-title").innerText = data.title;
            document.getElementById("tab-1").innerText = data.t1;
            document.getElementById("tab-2").innerText = data.t2;
            document.getElementById("tab-3").innerText = data.t3;
            document.getElementById("tab-4").innerText = data.t4;
        }

        function openModal(index) {
            currentSphereIndex = index;
            populateModal(index);
            switchTab(1);
            document.getElementById("modal").classList.add("active");
            playSingingBowl(index);
        }

        function closeModal() { document.getElementById("modal").classList.remove("active"); }

        function switchTab(tabNum) {
            for(let i=1; i<=4; i++) {
                document.getElementById("tab-"+i).classList.remove("active");
                document.getElementById(`tab-btn-${i}`).classList.remove("active");
            }
            document.getElementById("tab-"+tabNum).classList.add("active");
            document.getElementById(`tab-btn-${tabNum}`).classList.add("active");
        }

        // --- NEU: Deep Space Animation (Canvas) ---
        const cv = document.getElementById('sky'), cx = cv.getContext('2d');
        let W, H, stars = [], shoots = [], nextShoot = 2000;
        const tints = ['255,255,255', '255,240,200', '200,225,255'];

        function initSky() {
            W = cv.width = innerWidth; H = cv.height = innerHeight;
            stars = Array.from({length: Math.round(W * H / 4500)}, () => ({
                x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.2,
                p: Math.random() * 6.28, s: Math.random() * 1.6 + 0.4,
                c: tints[Math.floor(Math.random() * tints.length)]
            }));
        }

        function spawnShoot() {
            const a = (Math.random() * 0.5 + 0.3), dir = Math.random() < 0.5 ? 1 : -1;
            shoots.push({
                x: Math.random() * W * (dir > 0 ? 0.7 : 1), y: Math.random() * H * 0.4,
                vx: Math.cos(a) * dir * (10 + Math.random() * 6), vy: Math.sin(a) * (10 + Math.random() * 6),
                life: 0, max: 40 + Math.random() * 25
            });
        }

        function frameSky(t) {
            cx.clearRect(0, 0, W, H);
            for (const s of stars) {
                const k = 0.5 + 0.5 * Math.sin(t / 1000 * s.s + s.p);
                cx.fillStyle = `rgba(${s.c},${0.2 + 0.8 * k})`;
                cx.beginPath(); cx.arc(s.x, s.y, s.r * (0.8 + 0.3 * k), 0, 6.283); cx.fill();
            }
            if (t > nextShoot) { spawnShoot(); nextShoot = t + 3000 + Math.random() * 5000; }
            shoots = shoots.filter(s => s.life < s.max);
            for (const s of shoots) {
                s.x += s.vx; s.y += s.vy; s.life++;
                const f = 1 - s.life / s.max, tx = s.x - s.vx * 6, ty = s.y - s.vy * 6;
                const g = cx.createLinearGradient(s.x, s.y, tx, ty);
                g.addColorStop(0, `rgba(255,255,255,${f})`); g.addColorStop(1, 'rgba(180,200,255,0)');
                cx.strokeStyle = g; cx.lineWidth = 1.5; cx.lineCap = 'round';
                cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(tx, ty); cx.stroke();
            }
            requestAnimationFrame(frameSky);
        }

        // Initialer Start
        setLanguage('de');
        initSky();
        addEventListener('resize', initSky);
        requestAnimationFrame(frameSky);
    </script>
</body>
</html>
