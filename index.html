<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lex Causae - Die 7 Sphären</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital@0;1&display=swap');

        :root {
            --bg-color: #07090f;
            --gold: #d4af37;
            --gold-dim: #8c6a28;
            --text-main: #e2dcd3;
            --text-dim: #9da7b3;
            --modal-bg: #11141c;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'EB Garamond', serif;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, #161a2b 0%, #07090f 100%);
            min-height: 100vh;
        }

        h1, h2, h3, .tab-btn, .lang-btn {
            font-family: 'Cinzel', serif;
        }

        /* Sprachwechsler */
        .lang-switch {
            position: absolute;
            top: 20px; right: 20px;
            display: flex; gap: 10px;
        }
        .lang-btn {
            background: transparent;
            border: 1px solid var(--gold-dim);
            color: var(--gold-dim);
            padding: 5px 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .lang-btn.active, .lang-btn:hover {
            background: var(--gold-dim);
            color: #000;
        }

        /* Header */
        header {
            text-align: center;
            padding: 60px 20px 20px;
        }
        header h1 {
            font-size: 3rem;
            color: var(--gold);
            letter-spacing: 8px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }
        header p {
            font-size: 1.2rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            font-style: italic;
        }

        /* Sphären-Grid */
        .system-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .sphere {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.4s ease, filter 0.4s ease;
        }
        .sphere:hover {
            transform: translateY(-10px) scale(1.05);
            filter: drop-shadow(0 0 20px var(--gold-dim));
        }

        .planet {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            box-shadow: inset -15px -15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.1);
        }

        .p1 { background: radial-gradient(circle at 30% 30%, #4a6fa5, #1e2a3b); } /* Krone */
        .p2 { background: radial-gradient(circle at 30% 30%, #528c73, #182e23); } /* Stirn */
        .p3 { background: radial-gradient(circle at 30% 30%, #b56c42, #4a2110); } /* Hals */
        .p4 { background: radial-gradient(circle at 30% 30%, #9e3d43, #381013); } /* Herz */
        .p5 { background: radial-gradient(circle at 30% 30%, #c4a773, #4f4027); } /* Solarplexus */
        .p6 { background: radial-gradient(circle at 30% 30%, #7a426f, #2b1326); } /* Sakral */
        .p7 { background: radial-gradient(circle at 30% 30%, #d1c058, #4d4411); } /* Wurzel */

        .sphere-title {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--text-main);
            letter-spacing: 2px;
            text-align: center;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            backdrop-filter: blur(8px);
            z-index: 1000;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--modal-bg);
            border: 2px solid var(--gold-dim);
            max-width: 700px;
            width: 90%;
            border-radius: 4px;
            padding: 40px;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(212, 175, 55, 0.1);
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 2rem;
            color: var(--gold-dim);
            cursor: pointer;
            transition: color 0.3s;
        }
        .close-btn:hover { color: var(--gold); }

        #modal-title {
            color: var(--gold);
            font-size: 2.2rem;
            margin-top: 0;
            letter-spacing: 4px;
            border-bottom: 1px solid var(--gold-dim);
            padding-bottom: 20px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: 1px solid var(--gold-dim);
            color: var(--text-dim);
            padding: 8px 15px;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: var(--gold-dim);
            color: #000;
            font-weight: bold;
        }

        .tab-content {
            display: none;
            font-size: 1.3rem;
            line-height: 1.6;
            animation: fadeIn 0.5s;
        }
        .tab-content.active { display: block; }
        
        .bowl-indicator {
            font-size: 0.9rem;
            color: var(--gold-dim);
            margin-top: 20px;
            font-style: italic;
            opacity: 0.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button class="lang-btn active" onclick="setLanguage('de')" id="btn-de">DE</button>
        <button class="lang-btn" onclick="setLanguage('es')" id="btn-es">ES</button>
    </div>

    <header>
        <h1 id="main-title">Lex Causae</h1>
        <p id="main-subtitle">Wähle eine Sphäre, um die kosmische Ordnung freizulegen.</p>

    <div class="system-container" id="spheres-container">
        <!-- Generiert durch JavaScript -->
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">

            <div class="tabs">

                <button class="tab-btn" onclick="switchTab(3)" id="tab-btn-3">3. Kodex</button>
                <button class="tab-btn" onclick="switchTab(4)" id="tab-btn-4">4. Praxis</button>

            <div id="tab-1" class="tab-content active"></div>

            <div class="bowl-indicator" id="bowl-text">Klangschale resoniert...</div>

    </div>

    <script>
        // --- KLANGSCHALEN (Web Audio API) ---
        // Die 7 Solfeggio/Chakra-Frequenzen für die Planeten
        const bowlFreqs = [246.94, 440.00, 392.00, 349.23, 329.63, 293.66, 261.63]; 
        let audioCtx;

        function playSingingBowl(index) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const freq = bowlFreqs[index];
            
            // Oszillator 1 (Hauptton)
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.value = freq;
            
            // Oszillator 2 (Leicht verstimmt für das "Wummern"/Schwingen der Schale)
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.value = freq + 1.5; 

            osc1.connect(gain1);
            osc2.connect(gain2);
            gain1.connect(audioCtx.destination);
            gain2.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            // Sanftes Ein- und Ausblenden (Fade In/Out)
            gain1.gain.setValueAtTime(0, now);
            gain1.gain.linearRampToValueAtTime(0.4, now + 1.5);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 10);
            
            gain2.gain.setValueAtTime(0, now);
            gain2.gain.linearRampToValueAtTime(0.3, now + 1.5);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 10);
            
            osc1.start(now); osc2.start(now);
            osc1.stop(now + 10); osc2.stop(now + 10);
        }

                },
                es: {

                    t3: "Nunca soy víctima de las circunstancias, sino siempre la causa consciente de mi destino.",
                    t4: "Rastreo de causas: Ante cada error, preguntar '¿Qué causa he plantado?' y ajustar la propia conducta."
                }
            },
            {
                de: {
                    title: "VII. Generierung & Vertrauen",
                    t1: "Schöpfung erfordert die Verschmelzung zweier Pole (Struktur und Dynamik, Ordnung und Chaos).",
                    t2: "Das parasympathische System (Regeneration) nährt den Willen; Schöpfungskraft entsteht erst, wenn chronische Überlebensangst weicht.",
                    t3: "Ich schütze meine Kraft, wirke integer und großzügig und lasse mein Werk für sich sprechen.",
                    t4: "Aufbau langlebiger Systeme: Vermögensaufbau, bleibende Dokumente, Weitergabe von Wissen – Ordnung schaffen für die Ewigkeit."
                },
                es: {
                    title: "VII. Generación y Confianza",
                    t1: "La creación requiere la fusión de dos polos (estructura y dinámica, orden y caos).",
                    t2: "El sistema parasimpático nutre la voluntad; la fuerza creativa surge cuando el miedo a la supervivencia desaparece.",
                    t3: "Protejo mi fuerza, actúo con integridad y generosidad, y dejo que mi obra hable por sí misma.",
                    t4: "Construcción de sistemas duraderos: Creación de patrimonio, documentos legados, transmisión de conocimientos para la posteridad."
                }
            }
        ];

        // --- RENDER & LOGIK ---
        function renderSpheres() {
            const container = document.getElementById("spheres-container");
            container.innerHTML = "";
            spheresData.forEach((sphere, i) => {
                const div = document.createElement("div");
                div.className = "sphere";
                div.onclick = () => openModal(i);
                div.innerHTML = `
                    <div class="planet p${i+1}"></div>
                    <div class="sphere-title">${sphere[currentLang].title}</div>
                `;
                container.appendChild(div);
            });
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById("btn-de").classList.toggle("active", lang === 'de');
            document.getElementById("btn-es").classList.toggle("active", lang === 'es');
            
            document.getElementById("main-title").innerText = uiText[lang].title;
            document.getElementById("main-subtitle").innerText = uiText[lang].subtitle;
            document.getElementById("bowl-text").innerText = uiText[lang].bowl;
            
            for(let i=1; i<=4; i++) {
                document.getElementById(`tab-btn-${i}`).innerText = uiText[lang].tabs[i-1];
            }
            
            renderSpheres();
            
            // Falls das Modal gerade offen ist, Texte aktualisieren
            if (document.getElementById("modal").classList.contains("active")) {
                populateModal(currentSphereIndex);
            }
        }

        function populateModal(index) {
            const data = spheresData[index][currentLang];
            document.getElementById("modal-title").innerText = data.title;
            document.getElementById("tab-1").innerText = data.t1;
            document.getElementById("tab-2").innerText = data.t2;
            document.getElementById("tab-3").innerText = data.t3;
            document.getElementById("tab-4").innerText = data.t4;
        }

        function openModal(index) {
            currentSphereIndex = index;
            populateModal(index);
            switchTab(1);
            document.getElementById("modal").classList.add("active");
            playSingingBowl(index); // SOUND ABSPIELEN
        }

        function closeModal() {
            document.getElementById("modal").classList.remove("active");
        }

        function switchTab(tabNum) {
            for(let i=1; i<=4; i++) {
                document.getElementById("tab-"+i).classList.remove("active");
                document.getElementById(`tab-btn-${i}`).classList.remove("active");
            }
            document.getElementById("tab-"+tabNum).classList.add("active");
            document.getElementById(`tab-btn-${tabNum}`).classList.add("active");
        }

        // Initialer Aufruf
        setLanguage('de');

</body>
</html>
